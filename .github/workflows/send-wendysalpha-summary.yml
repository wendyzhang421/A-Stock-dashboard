name: Send WendysAlpha Summary to Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate files without sending Telegram or advancing state
        required: false
        default: false
        type: boolean
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 in Asia/Shanghai.
    - cron: "17 4,10,16,22 * * *"

permissions:
  contents: read

concurrency:
  group: send-wendysalpha-summary
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      ASTOCK_TRUST_ENV: "0"
      WENDYSALPHA_TELEGRAM_BOT_TOKEN: ${{ secrets.WENDYSALPHA_TELEGRAM_BOT_TOKEN }}
      WENDYSALPHA_TELEGRAM_CHANNEL: "@wendysalpha"
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.WENDYSALPHA_XAI_MODEL || 'grok-4.7' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install requests Pillow openpyxl beautifulsoup4

      - name: Restore deduplication state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .state/wendysalpha.json
          key: wendysalpha-state-${{ github.run_id }}
          restore-keys: |
            wendysalpha-state-

      - name: Generate and send summaries
        shell: bash
        run: |
          set -euo pipefail
          args=(--hours 6)
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/send_wendysalpha_summary.py "${args[@]}"

      - name: Save deduplication state
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: .state/wendysalpha.json
          key: wendysalpha-state-${{ github.run_id }}

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wendysalpha-${{ github.run_id }}
          path: reports/wendysalpha/
          if-no-files-found: ignore
          retention-days: 14
