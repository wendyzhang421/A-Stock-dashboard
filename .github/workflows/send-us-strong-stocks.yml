name: Send US Strong Stocks to Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate without sending Telegram
        required: false
        default: false
        type: boolean
  schedule:
    # 10:30 UTC = 18:30 Beijing. Tue-Sat sends the prior US trading session recap.
    - cron: "30 10 * * 2-6"

permissions:
  contents: read

concurrency:
  group: send-us-strong-stocks
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      ASTOCK_TRUST_ENV: "0"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_US_THREAD_ID: ${{ secrets.TELEGRAM_US_THREAD_ID }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      STOCKNEWS_API_KEY: ${{ secrets.STOCKNEWS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install dependencies and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements-actions.txt

      - name: Generate and send recap
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/send_us_strong_stocks.py "${args[@]}"

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: us-strong-stocks-${{ github.run_id }}
          path: reports/us_strong_stocks/
          if-no-files-found: ignore
          retention-days: 7
