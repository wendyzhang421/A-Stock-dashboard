name: Refresh A-Share Dashboard

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional trading date in YYYY-MM-DD format
        required: false
        type: string
  schedule:
    - cron: "10 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ASTOCK_TRUST_ENV: "0"
      ASTOCK_IFIND_REFRESH_TOKEN: ${{ secrets.ASTOCK_IFIND_REFRESH_TOKEN }}
      ASTOCK_AS_OF: ${{ github.event.inputs.as_of || '' }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ secrets.XAI_MODEL || 'grok-3-mini' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      ASTOCK_REFRESH_STEP_TIMEOUT_SECONDS: "3600"
      ASTOCK_REFRESH_TIMEOUT_SECONDS: "1200"
      ASTOCK_CLOUD_LIVE_LOOKUPS: "0"
      ASTOCK_SKIP_LIVE_NEWS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve refresh date
        id: refresh-date
        shell: bash
        run: |
          if [ -n "${ASTOCK_AS_OF}" ]; then
            echo "value=${ASTOCK_AS_OF}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=$(TZ=Asia/Shanghai date +%F)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Refresh social media summaries
        shell: bash
        run: |
          set +e
          python scripts/refresh_social_media.py
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "Social media refresh failed; continuing dashboard refresh."
            echo "Social media refresh failed; continuing dashboard refresh." >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit 0

      - name: Refresh dashboard
        shell: bash
        run: |
          set -euo pipefail
          refresh_date="${{ steps.refresh-date.outputs.value }}"
          if [ -f "reports/watchlist_dashboard_${refresh_date}.html" ] && [ -f "reports/watchlist_strong_stocks_${refresh_date}.json" ]; then
            echo "Using committed reports for ${refresh_date}; skipping live refresh."
            echo "Using committed reports for ${refresh_date}; skipped live refresh." >> "${GITHUB_STEP_SUMMARY}"
          else
            timeout "${ASTOCK_REFRESH_STEP_TIMEOUT_SECONDS:-1200}" python scripts/cloud_refresh_dashboard.py "${refresh_date}"
          fi
          for required in \
            "reports/watchlist_dashboard_${refresh_date}.html" \
            "reports/watchlist_dashboard_${refresh_date}.json" \
            "reports/watchlist_strong_stocks_${refresh_date}.json" \
            "reports/share_dashboard/index.html"; do
            if [ ! -s "${required}" ]; then
              echo "::error::Missing refreshed dashboard output: ${required}"
              exit 1
            fi
          done
          if ! grep -q "watchlist_dashboard_${refresh_date}.html" reports/share_dashboard/index.html; then
            echo "::error::share_dashboard/index.html does not point at ${refresh_date}."
            exit 1
          fi
          echo "Dashboard reports are ready for ${refresh_date}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit refreshed reports
        shell: bash
        run: |
          if git diff --quiet -- reports; then
            echo "No report changes to commit."
            echo "No new report files were generated for ${{ steps.refresh-date.outputs.value }}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Refresh dashboard for ${{ steps.refresh-date.outputs.value }}"
          git fetch origin main
          git rebase origin/main
          git push
          echo "Committed refreshed reports for ${{ steps.refresh-date.outputs.value }}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish reports to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          refresh_date="${{ steps.refresh-date.outputs.value }}"
          publish_dir="$(mktemp -d)"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add "${publish_dir}" origin/gh-pages

          cname_value="stockkiller.xyz"
          if [ -f "${publish_dir}/CNAME" ]; then
            cname_value="$(cat "${publish_dir}/CNAME")"
          fi

          rsync -a --delete --exclude '.git' --exclude '.vercel/' reports/ "${publish_dir}/"
          printf '%s\n' "${cname_value}" > "${publish_dir}/CNAME"

          cd "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish."
            echo "No gh-pages changes to publish for ${refresh_date}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git commit -m "Publish dashboard reports for ${refresh_date}"
          git push origin HEAD:gh-pages
          echo "Published dashboard reports for ${refresh_date} to gh-pages." >> "${GITHUB_STEP_SUMMARY}"
